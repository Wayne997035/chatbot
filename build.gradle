plugins {
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
}

group = 'com.opendata'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// === 核心與 Web 框架 ===
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// === 資料庫與快取 ===
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// === 定時任務 ===
	implementation 'org.springframework.boot:spring-boot-starter-quartz'

	// === 工具與函式庫 ===
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	compileOnly 'org.projectlombok:lombok:1.18.38'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'

	// === 測試 ===
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

// [F1-04] compileTestJava 的 exclude 作用在原始碼層（編譯前），只設 test{exclude} 擋不住編譯失敗。
// ChatbotApplicationTests.java 匯入不存在的 DGS 依賴 —— 開工單事實表第 8 列已知。
// OpenDataServiceTest.java 實測同樣編不過：AutoConfigureMockMvc 在 Spring Boot 4.0.8 的
// spring-boot-test-autoconfigure 內已不存在（該類別搬到獨立模組 spring-boot-webmvc-test，
// 未被 spring-boot-starter-test 帶入）——與開工單事實表第 8 列「OpenDataServiceTest 編得過」
// 不符，本輪不加新依賴／不升版本（Boundaries），改在編譯層一併排除，效果同為「不修內容、不執行」。
compileTestJava {
	exclude '**/ChatbotApplicationTests.java'
	exclude '**/OpenDataServiceTest.java'
}

// [F1-04] 原本連 useJUnitPlatform() 都沒設：即使把上面兩層排除都設對，Gradle 的 test 任務預設用
// JUnit4 runner 收案，JUnit Jupiter（@org.junit.jupiter.api.Test）一支都收不到，
// 實測 `./gradlew test` 會直接 FAILED（"did not discover any tests to execute"）。
// 這是「測試真的被執行」的必要條件，不是新依賴 —— spring-boot-starter-test 已含 JUnit Platform。
test {
	useJUnitPlatform()
}
